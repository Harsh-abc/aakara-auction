services:
  redis:
    image: redis:7-alpine
    container_name: auction_redis
    restart: unless-stopped
    # localhost only — Redis holds the live bids, so it must never be reachable from the network
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    # noeviction: never silently drop bid keys when memory is full
    command: redis-server --appendonly yes --maxmemory-policy noeviction

volumes:
  postgres_data:
  redis_data: